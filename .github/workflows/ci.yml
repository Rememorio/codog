name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    name: go test and parity
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Run smoke checks
        env:
          CODOG_SMOKE_ARTIFACT_DIR: artifacts
        run: scripts/smoke.sh

      - name: Upload mock parity report
        uses: actions/upload-artifact@v4
        with:
          name: mock-parity-report
          path: artifacts/mock-parity-*.json
