name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    name: go test and parity
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Run tests
        run: go test ./...

      - name: Run mock parity harness
        env:
          MOCK_PARITY_REPORT_PATH: artifacts/mock-parity-report.json
        run: |
          mkdir -p artifacts
          go run ./cmd/codog mock-parity --output-format json | tee artifacts/mock-parity-stdout.json
          jq -e '
            .schema_version == "codog.mock_parity.v1" and
            .ok == true and
            .scenario_count == (.scenarios | length) and
            .request_count > 0
          ' artifacts/mock-parity-report.json

      - name: Build CLI
        run: go build ./cmd/codog

      - name: Upload mock parity report
        uses: actions/upload-artifact@v4
        with:
          name: mock-parity-report
          path: artifacts/mock-parity-*.json
